<text x="470" y="24" text-anchor="middle" fill="#8b949e" style="font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">cleanyourphone · old phone, one prompt</text>
<text class="l0" x="28" y="64" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">./cmp go</tspan></text>
<text class="l1" x="28" y="88" xml:space="preserve"><tspan fill="#8b949e">== Phone   </tspan><tspan fill="#e6edf3">realme RMX2151 · Android 12 · realme UI 3.0</tspan></text>
<text class="l2" x="28" y="112" xml:space="preserve"><tspan fill="#8b949e">== Backup  </tspan><tspan fill="#e6edf3">335 packages, settings and default apps saved</tspan></text>
<text class="l3" x="28" y="136" xml:space="preserve"><tspan fill="#8b949e">== Bloat   </tspan><tspan fill="#e6edf3">61 preinstalled apps in 6 groups · 3 apps unused for 30+ days</tspan></text>
<text class="l4" x="28" y="160" xml:space="preserve"><tspan fill="#f0b357">? </tspan><tspan fill="#e6edf3">Which preinstalled bloat groups should I remove?</tspan></text>
<text class="l5" x="46" y="184" xml:space="preserve"><tspan fill="#7ee787">[x] </tspan><tspan fill="#e6edf3">Ads &amp; tracking (15)     </tspan><tspan fill="#7ee787">[x] </tspan><tspan fill="#e6edf3">realme duplicates (11)</tspan></text>
<text class="l6" x="46" y="208" xml:space="preserve"><tspan fill="#7ee787">[x] </tspan><tspan fill="#e6edf3">Test &amp; engineering (12) </tspan><tspan fill="#8b949e">[ ] </tspan><tspan fill="#8b949e">realme extras (11)</tspan></text>
<text class="l7" x="28" y="232" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">./cmp go --yes --remove "1 2 3" --uninstall "a"</tspan></text>
<text class="l8" x="28" y="256" xml:space="preserve"><tspan fill="#8b949e">Batch 1/8   </tspan><tspan fill="#e6edf3">com.glance.internet  com.heytap.mcs  com.oplus.statistics.rom</tspan></text>
<text class="l9" x="136" y="280" xml:space="preserve"><tspan fill="#7ee787">✓ checks ok</tspan></text>
<text class="l10" x="28" y="304" xml:space="preserve"><tspan fill="#8b949e">Batch 2/8   </tspan><tspan fill="#e6edf3">com.heytap.browser  com.heytap.music  com.coloros.video</tspan></text>
<text class="l11" x="136" y="328" xml:space="preserve"><tspan fill="#7ee787">✓ checks ok</tspan></text>
<text class="l12" x="28" y="352" xml:space="preserve"><tspan fill="#8b949e">Batch 3/8   </tspan><tspan fill="#e6edf3">com.heytap.market  </tspan><tspan fill="#f0b357">suspend (the phone protects it)</tspan></text>
<text class="l13" x="136" y="376" xml:space="preserve"><tspan fill="#7ee787">✓ checks ok</tspan><tspan fill="#8b949e">   ...</tspan></text>
<text class="l14" x="28" y="400" xml:space="preserve"><tspan fill="#8b949e">== Speed   </tspan><tspan fill="#e6edf3">animations 0.5× · 90Hz · 1.5 GB of caches cleared</tspan></text>
<text class="l15" x="28" y="424" xml:space="preserve"><tspan fill="#8b949e">== Restart </tspan><tspan fill="#7ee787">✓ phone healthy after reboot</tspan></text>
<text class="l16" x="28" y="448" xml:space="preserve"><tspan fill="#79c0ff">DONE</tspan></text>
<text class="l17" x="46" y="472" xml:space="preserve"><tspan fill="#7ee787">~60% more free RAM</tspan></text>
<text class="l18" x="46" y="496" xml:space="preserve"><tspan fill="#7ee787">~20% fewer apps</tspan></text>
<text class="l19" x="46" y="520" xml:space="preserve"><tspan fill="#7ee787">~2× faster animations</tspan></text>
<text class="l20" x="46" y="544" xml:space="preserve"><tspan fill="#8b949e">undo everything: </tspan><tspan fill="#e6edf3">./cmp restore</tspan></text>
